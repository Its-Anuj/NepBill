<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - NepBill</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/Specific/BusinessOwner.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="header-container">
        <div class="nav-left">
          <a href="/" class="brand">Nep<span>Bill</span></a>
          <ul class="nav-links">
            <li><a href="#products">Products</a></li>
            <li><a href="#partners">Partners</a></li>
            <li><a href="#resources">Resources</a></li>
          </ul>
        </div>

        <div class="nav-right">
          <select class="lang-select">
            <option value="en">English</option>
            <option value="np">Nepali</option>
          </select>
          <div id="AccountHeaderSection"></div>
        </div>
      </div>
    </header>

    <!-- BOXED MAIN CONTAINER -->
    <main class="dashboard-wrapper">
      <div class="dashboard-box">
        <aside id="sidebar-container" class="sidebar"></aside>

        <!-- DASHBOARD CONTENT (INSIDE BOX) -->
        <section class="dashboard-content">
          <div class="inventory-toolbar">
            <h2>Inventory Items</h2>
            <a id="add_item_and_category" class="btn-primary"
              >Add Item & Category</a
            >
          </div>

          <div class="service-detail-box">
            <div class="table-wrapper">
              <table class="comparison-table inventory-table">
                <thead>
                  <tr>
                    <th>Item Name</th>
                    <th>Category</th>
                    <th>Low Stock Threshold</th>
                    <th>Current Stock</th>
                    <th>Track Stock</th>
                    <th>Description</th>
                    <th style="text-align: right">Actions</th>
                  </tr>
                </thead>
                <tbody id="inventory-table-body">
                  <tr>
                    <td colspan="7" class="table-placeholder">
                      Loading inventory data...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-container">
        <span>&copy; 2026 NepBill</span>
        <ul class="footer-links">
          <li><a href="#privacy">Privacy</a></li>
          <li><a href="#terms">Terms</a></li>
          <li><a href="#support">Support</a></li>
        </ul>
      </div>
    </footer>

    <script src="/AccountTypes.js" type="module"></script>
    <script src="/index.js" type="module"></script>
    <script src="/Account.js" type="module"></script>
    <script src="/SideBar.js" type="module"></script>
    <script src="/Account/Inventory/Stock.js" type="module"></script>
  </body>
</html>
