<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - NepBill</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>/* Dashboard Main Layout */
.dashboard-wrapper {
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  background-color: #f8fafc;
  min-height: calc(100vh - 120px);
}

.dashboard-box {
  display: flex;
  width: 100%;
  max-width: 1200px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  border: 1px solid #e2e8f0;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 240px;
  border-right: 1px solid #e2e8f0;
  background-color: #fafafa;
  flex-shrink: 0;
}

/* Main Dashboard Content Area */
.dashboard-content {
  flex: 1;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Header Action Row */
.content-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.content-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #0f172a;
  margin: 0;
}

/* Primary Button Styling */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  background-color: #2563eb;
  color: #ffffff;
  font-weight: 600;
  font-size: 0.875rem;
  border-radius: 6px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.btn-primary:hover {
  background-color: #1d4ed8;
}

.btn-primary:active {
  transform: translateY(1px);
}

/* Data Table Container */
.table-wrapper {
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  background-color: #ffffff;
  font-size: 0.875rem;
}

.data-table th {
  background-color: #f8fafc;
  color: #475569;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  padding: 14px 20px;
  text-align: left;
  border-bottom: 1px solid #e2e8f0;
}

.data-table td {
  padding: 16px 20px;
  color: #334155;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}

.data-table tbody tr {
  transition: background-color 0.15s ease;
}

.data-table tbody tr:hover {
  background-color: #f8fafc;
}

.data-table tbody tr:last-child td {
  border-bottom: none;
}

/* Supplier Link */
.supplier-link {
  color: #2563eb;
  font-weight: 600;
  text-decoration: none;
  transition: color 0.15s ease;
}

.supplier-link:hover {
  color: #1d4ed8;
  text-decoration: underline;
}

/* Status Badges */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: capitalize;
  letter-spacing: 0.025em;
}

.badge-success {
  background-color: #dcfce7;
  color: #15803d;
}

.badge-warning {
  background-color: #fef9c3;
  color: #a16207;
}

.badge-danger {
  background-color: #fee2e2;
  color: #b91c1c;
}

.badge-secondary {
  background-color: #f1f5f9;
  color: #475569;
}

/* Row Action Buttons */
.action-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-action {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.8125rem;
  font-weight: 500;
  text-decoration: none;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.btn-view {
  background-color: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
}

.btn-view:hover {
  background-color: #e2e8f0;
  color: #0f172a;
}

.btn-edit {
  background-color: #eff6ff;
  color: #2563eb;
  border: 1px solid #bfdbfe;
}

.btn-edit:hover {
  background-color: #dbeafe;
  color: #1d4ed8;
}
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="header-container">
        <div class="nav-left">
          <a href="/" class="brand">Nep<span>Bill</span></a>
          <ul class="nav-links">
            <li><a href="#products">Products</a></li>
            <li><a href="#partners">Partners</a></li>
            <li><a href="#resources">Resources</a></li>
          </ul>
        </div>

        <div class="nav-right">
          <select class="lang-select">
            <option value="en">English</option>
            <option value="np">Nepali</option>
          </select>
          <div id="AccountHeaderSection"></div>
        </div>
      </div>
    </header>
<main class="dashboard-wrapper">
  <div class="dashboard-box">
    <!-- SIDEBAR -->
    <aside id="sidebar-container" class="sidebar"></aside>

    <!-- DASHBOARD CONTENT AREA -->
    <div class="dashboard-content">
      <div class="content-header">
        <h1 class="content-title">Purchase Orders</h1>
        <a id="create_purchase_order" class="btn-primary">
          <span>+ Create Purchase Order</span>
        </a>
      </div>

      <div id="orders_table"></div>
    </div>
  </div>
</main>
    <!-- FOOTER -->
    <footer>
      <div class="footer-container">
        <span>&copy; 2026 NepBill</span>
        <ul class="footer-links">
          <li><a href="#privacy">Privacy</a></li>
          <li><a href="#terms">Terms</a></li>
          <li><a href="#support">Support</a></li>
        </ul>
      </div>
    </footer>

    <script src="/AccountTypes.js" type="module"></script>
    <script src="/index.js" type="module"></script>
    <script src="/SideBar.js" type="module"></script>
    <script src="/Account.js" type="module"></script>
    <script src="/Account/Inventory/PurchaseOrder.js" type="module"></script>
  </body>
</html>
